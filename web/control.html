<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoC-KBD control</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:#0d1117; color:#e6edf3; padding:20px; max-width:520px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8b949e; font-size:13px; margin-bottom:16px; }
  button { padding:11px 15px; border:0; border-radius:10px; font-size:15px; font-weight:600; color:#04181b; background:#22d3e0; cursor:pointer; }
  button.sec { background:transparent; color:#e6edf3; border:1px solid #30363d; }
  button.warn { background:transparent; color:#f7c948; border:1px solid #7a5c12; }
  button:disabled { opacity:.45; }
  input { flex:1; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid #30363d; background:#161b22; color:#e6edf3; font-size:16px; }
  .row { display:flex; gap:8px; margin:10px 0; align-items:center; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:#8b949e; margin:20px 0 6px; }
  .dev { display:flex; justify-content:space-between; align-items:center; background:#161b22; border:1px solid #21262d; border-radius:9px; padding:9px 11px; margin:6px 0; gap:8px; }
  .dev .a { font:13px ui-monospace,monospace; }
  .dev .s { font-size:12px; }
  .dev button { padding:6px 10px; font-size:13px; }
  #stat { font-size:13px; color:#8b949e; margin-top:10px; }
  #log { margin-top:12px; background:#161b22; border:1px solid #30363d; border-radius:8px; padding:10px; font:12px/1.5 ui-monospace,monospace; white-space:pre-wrap; min-height:44px; max-height:30vh; overflow:auto; }
</style>
</head>
<body>
<h1>🐷 PoC-KBD control</h1>
<div class="sub">Connect over Bluetooth, send text (typed into the paired PC over BLE-HID), and manage the board's paired devices. Chrome/Edge, https or localhost.</div>

<button id="connect" style="width:100%">Connect to PoC-KBD</button>
<div id="stat"></div>

<div id="app" hidden>
  <div class="row">
    <input id="text" placeholder="text to type on the PC" value="hello from my phone">
    <button id="send">Send</button>
  </div>

  <h2>Board devices</h2>
  <div class="row">
    <button id="list" class="sec" style="flex:1">↻ Refresh</button>
    <button id="drop" class="warn">Drop links</button>
  </div>
  <div id="devices"></div>

  <div id="log"></div>
</div>

<script>
const SVC = 'a0c50000-1234-4b0a-9c5e-000000000000';
const RX  = 'a0c50001-1234-4b0a-9c5e-000000000000';
const TX  = 'a0c50002-1234-4b0a-9c5e-000000000000';
const $ = id => document.getElementById(id);
function log(m){ const e=$('log'); e.textContent += m+'\n'; e.scrollTop = e.scrollHeight; }

let rxCh = null, refreshTimer = null;

async function sendCmd(s){
  if(!rxCh) return;
  const d = new TextEncoder().encode(s);
  if (rxCh.writeValueWithoutResponse) await rxCh.writeValueWithoutResponse(d);
  else await rxCh.writeValue(d);
}

function renderDevices(payload){
  // "bonds:idx|addr|conn;idx|addr|conn" or "bonds:(none)"
  const body = payload.slice('bonds:'.length);
  const box = $('devices'); box.innerHTML = '';
  if (body === '(none)' || body === '') { box.innerHTML = '<div class="sub">no paired devices</div>'; return; }
  for (const part of body.split(';')) {
    const [idx, addr, conn] = part.split('|');
    const row = document.createElement('div'); row.className = 'dev';
    const st = conn === '1' ? '<span class="s" style="color:#3fb950">● connected</span>'
                            : '<span class="s" style="color:#8b949e">○ bonded</span>';
    const left = document.createElement('div');
    left.innerHTML = `<div class="a">${addr}</div>${st}`;
    const btn = document.createElement('button'); btn.className = 'warn'; btn.textContent = 'Forget';
    btn.onclick = async () => { await sendCmd('__FORGET__:' + idx); setTimeout(() => sendCmd('__BONDS__'), 400); };
    row.appendChild(left); row.appendChild(btn); box.appendChild(row);
  }
}

$('connect').onclick = async () => {
  if (!navigator.bluetooth) { $('stat').textContent = '✖ Web Bluetooth unavailable — use Chrome/Edge, not iOS/Safari.'; return; }
  try {
    $('stat').textContent = 'requesting device…';
    const dev = await navigator.bluetooth.requestDevice({ filters:[{ name:'PoC-KBD' }], optionalServices:[SVC] });
    dev.addEventListener('gattserverdisconnected', () => {
      $('stat').textContent = '⚠ disconnected'; $('app').hidden = true; $('connect').hidden = false;
      if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    });
    const g = await dev.gatt.connect();
    const svc = await g.getPrimaryService(SVC);
    rxCh = await svc.getCharacteristic(RX);
    const txCh = await svc.getCharacteristic(TX);
    await txCh.startNotifications();
    txCh.addEventListener('characteristicvaluechanged', e => {
      const v = new TextDecoder().decode(e.target.value);
      if (v.startsWith('bonds:')) renderDevices(v); else log('board: ' + v);
    });
    $('stat').textContent = '✔ connected to ' + (dev.name || 'PoC-KBD');
    $('connect').hidden = true; $('app').hidden = false;
    sendCmd('__BONDS__');                                   // list now
    refreshTimer = setInterval(() => sendCmd('__BONDS__'), 3000);   // auto-refresh
  } catch (e) { $('stat').textContent = '✖ ' + e.message; }
};

async function send(){
  const t = $('text').value; if (!t || !rxCh) return;
  try { await sendCmd(t); log('sent: ' + t); } catch (e) { log('✖ ' + e.message); }
}
$('send').onclick = send;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('list').onclick = () => sendCmd('__BONDS__');
$('drop').onclick = async () => { if (confirm('Disconnect all current BLE links?')) await sendCmd('__DROP__'); };
</script>
</body>
</html>
