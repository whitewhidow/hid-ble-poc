; USB-HID -> BLE-HID pairing-bootstrap PoC. One codebase, two boards, selected by
; build flags. Both envs use the pioarduino platform (arduino 3.x) so they SHARE
; one NimBLE 2.x HID-keyboard implementation.
[platformio]
default_envs = waveshare

[env:waveshare]
; Waveshare ESP32-C5-LCD-1.47 — BLE HID only (C5 has no USB-OTG). No battery, so
; unplugging fully resets it; flashes over native USB-Serial-JTAG with auto-reset.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -DPOC_BOARD_WAVESHARE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1

[env:tembed]
; LilyGo T-Embed CC1101 — ESP32-S3, USB HID + BLE HID.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -DPOC_BOARD_TEMBED
    -DPOC_HAS_USB_HID
    -DARDUINO_USB_MODE=0
    ; Optional: uncomment for AUTORUN — selecting an OS arms the board; it then
    ; auto-fires the payload when plugged into a host. Default (commented) =
    ; manual (selecting fires immediately).
    ; -DPOC_AUTORUN
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
