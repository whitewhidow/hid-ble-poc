; USB-HID -> BLE-HID pairing-bootstrap PoC. One codebase, both targets are
; ESP32-S3 (USB HID + BLE HID) selected by build flags, sharing one NimBLE 2.x
; HID-keyboard implementation and one WiFi in-app OTA path.
[platformio]
default_envs = tembed

[env:tembed]
; LilyGo T-Embed CC1101 — ESP32-S3, USB HID + BLE HID.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-tembed.csv    ; A/B OTA slots + littlefs (self-update over WiFi)
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -DPOC_BOARD_TEMBED
    -DPOC_HAS_USB_HID
    -DARDUINO_USB_MODE=0
    ; AUTORUN (arm-on-select, then auto-fire when plugged into a host) is a RUNTIME
    ; setting now — toggle it on the phone Update tab; it persists in NVS. No flag.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1

[env:tdongle]
; LilyGo T-Dongle S3 — ESP32-S3 USB-A dongle, USB HID + BLE HID, ST7735S 80x160
; LCD, no battery. 16MB flash assumed (confirm your variant). Pins UNVERIFIED
; until first boot on hardware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-tembed.csv    ; shared S3 16MB A/B OTA layout
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    h2zero/NimBLE-Arduino@^2.3.7
build_flags =
    -DPOC_BOARD_TDONGLE
    -DPOC_HAS_USB_HID
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=0
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
